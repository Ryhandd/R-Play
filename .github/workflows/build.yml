name: Build R-Play

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: rplay-linux-x64
            artifact_path: target/release/rplay
          - os: windows-latest
            artifact_name: rplay-setup-windows-x64
            artifact_path: target/release/rplay-setup-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Build Windows Setup installer
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $inno) {
              & $inno installer.iss
            } else {
              choco install innosetup -y
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
            }
          } else {
            iscc installer.iss
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
